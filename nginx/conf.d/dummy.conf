server {
    listen 80;
    server_name ttranking.juso-software.com;

    # Serve React frontend
    root /app/frontend/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /test {
        return 200 "Test endpoint for http://ttranking.juso-software.com";
    }

    # Serve static assets
    location /assets/ {
        root /app/frontend/dist/;
        expires 6M;
    }

    # Serve media files (uploaded images, etc.)
    location /media/ {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Accept, Authorization, Content-Type';
        alias /app/backend/media/;
        expires 6M;
    }

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy API to Django backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
